# La veille : chaque matin, GitHub lance l'extraction France Travail sur ses machines,
# met à jour data/ et le résumé de la page, et enregistre le tout par un commit.
# Les identifiants sont dans Settings -> Secrets and variables -> Actions (FT_CLIENT_ID, FT_CLIENT_SECRET).
name: veille

on:
  schedule:
    - cron: "23 4 * * *"      # 4 h 23 UTC = 5 h 23 à Paris en hiver, 6 h 23 en été ; GitHub peut démarrer en retard
  workflow_dispatch:          # et le bouton « Run workflow » pour lancer à la main
    inputs:
      sources:
        description: "Sources à collecter"
        type: choice
        default: toutes
        options: [toutes, france_travail]

permissions:
  contents: write             # le workflow doit pouvoir pousser son commit

jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Si France Travail refuse la connexion, on continue : les autres sources sont collectées quand même.
      - name: Extraire les offres France Travail
        id: france_travail
        continue-on-error: true
        env:
          # Les clés les plus récentes (3, puis 2) passent avant les anciennes
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID3 || secrets.FT_CLIENT_ID2 || secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET3 || secrets.FT_CLIENT_SECRET2 || secrets.FT_CLIENT_SECRET }}
        run: python scripts/extraire.py

      # Refait le résumé, collecte Jobicy, Himalayas, Arbeitnow et Remotive, et écrit data/observatoire.json
      - name: Refaire les résumés et collecter les autres sites
        env:
          OBSERVATOIRE_SANS_COLLECTE: ${{ inputs.sources == 'france_travail' && '1' || '' }}
        run: python scripts/resumer.py

      - name: Enregistrer la donnée du jour (commit + push)
        run: |
          git config user.name "veille-bot"
          git config user.email "actions@github.com"
          git add data
          git commit -m "veille : offres du $(date -u +%Y-%m-%d)" || echo "rien de nouveau"
          git push

      # Les autres sources sont déjà enregistrées : on passe le lancement au rouge pour signaler la panne
      - name: Signaler un échec France Travail
        if: steps.france_travail.outcome == 'failure'
        run: |
          echo "::error::France Travail a échoué : les offres affichées ne sont pas à jour."
          exit 1
